<script>
'use strict';
const DATA=JSON.parse(document.getElementById('schedule-data').textContent);
DATA.events.sort((a,b)=>(a[0]+'T'+a[2]).localeCompare(b[0]+'T'+b[2]));
const colors=[['#146b99','#eaf4fb'],['#08786e','#e7f5f1'],['#5963b1','#f0effc'],['#9b5e18','#fff5e4'],['#3d6a95','#edf3fa'],['#885296','#f6eefa'],['#256e56','#e9f4ee'],['#a44e39','#fbeee8'],['#827027','#f8f4df'],['#397d86','#edf6f7'],['#687585','#f0f3f7']];
const days=['周日','周一','周二','周三','周四','周五','周六'];
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateAdd(d,n){let x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function weekOf(d){return Math.floor((Date.parse(d+'T00:00:00Z')-Date.parse(DATA.weekStart+'T00:00:00Z'))/604800000)+1}
function shanghaiNow(){let p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}
function md(d){return `${Number(d.slice(5,7))}月${Number(d.slice(8))}日`}
function dayOf(d){return days[new Date(d+'T00:00:00Z').getUTCDay()]}
function style(i){return `--color:${colors[i][0]};--tint:${colors[i][1]}`}
function courseCard(e){let c=DATA.courses[e[1]];return `<article class="lesson" style="${style(e[1])}"><h3>${esc(c[1])}</h3><div class="time">${e[2]}–${e[3]}</div><div class="room">${esc(e[4])}</div><div class="count">${esc(c[2])} · 第 ${e[5]} 次</div>${e[6]?`<span class="exam">${esc(e[6])}</span>`:''}</article>`}
let clock=shanghaiNow();let chosen=Number(new URLSearchParams(location.search).get('week'));let current=weekOf(clock.date);
if(!Number.isInteger(chosen)||chosen<1||chosen>18)chosen=Math.max(1,Math.min(18,current));
$('week').innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}">第 ${i+1} 周</option>`).join('');
function nextClass(){clock=shanghaiNow();let ongoing=DATA.events.find(e=>e[0]===clock.date&&e[2]<=clock.time&&e[3]>clock.time);let event=ongoing||DATA.events.find(e=>e[0]>clock.date||(e[0]===clock.date&&e[2]>clock.time));
$('next').innerHTML=event?`<div class="label">${ongoing?'正在上课':'下一次上课'} · 已排定课程</div><h2>${esc(DATA.courses[event[1]][1])}</h2><p>${md(event[0])} ${dayOf(event[0])} &nbsp; ${event[2]}–${event[3]} &nbsp; / &nbsp; ${esc(event[4])}</p>`:`<div class="label">本学期 · 已排定课程</div><h2>暂无后续上课安排</h2><p>可切换教学周回看课表；未排定课程请查看下方详情。</p>`}
function renderWeek(){
clock=shanghaiNow();let start=dateAdd(DATA.weekStart,(chosen-1)*7),end=dateAdd(start,6);let events=DATA.events.filter(e=>e[7]===chosen);let english=DATA.englishDates.filter(d=>d>=start&&d<=end);
$('week-title').textContent=`第 ${chosen} 周`;$('week-range').textContent=`${start.replaceAll('-','.')} — ${end.replaceAll('-','.')}`;$('week').value=String(chosen);$('prev').disabled=chosen===1;$('next-week').disabled=chosen===18;
$('today').disabled=current<1||current>18;$('today').title=current<1||current>18?'当前日期不在此学期内':'回到本周';
$('pending-week').innerHTML=english.length?`<p class="pending-week">${english.map(d=>`${md(d)} ${dayOf(d)}`).join('、')}还有英语展示与公众演讲，大纲已列日期；具体时间与教室待补充。</p>`:'';
let html='<div class="corner">时段</div>';
for(let day=0;day<7;day++){let date=dateAdd(start,day);html+=`<div class="dayhead ${date===clock.date?'current':''}">${days[day]}<br><b>${Number(date.slice(-2))}</b></div>`}
const slots=[['上午','08:30','11:30'],['下午','14:00','17:00'],['晚上','18:30','21:30']];
slots.forEach((slot,i)=>{html+=`<div class="timecell"><b>${slot[0]}</b>${slot[1]}<br>—<br>${slot[2]}</div>`;for(let day=0;day<7;day++){let date=dateAdd(start,day),es=events.filter(e=>e[0]===date&&(e[2]<'12:00'?0:e[2]<'18:00'?1:2)===i);html+=`<div class="slot ${date===clock.date?'current':''} ${es.length?'':'empty'}">${es.length?es.map(courseCard).join(''):i===0&&DATA.holidays[date]?`<span class="holiday">${esc(DATA.holidays[date])}</span>`:'<span aria-label="此时段无已排定课程">·</span>'}</div>`}});
$('calendar').innerHTML=html;
$('mobile-week').innerHTML=Array.from({length:7},(_,day)=>{let date=dateAdd(start,day),es=events.filter(e=>e[0]===date);return `<section class="mobile-day ${date===clock.date?'current':''}"><h3>${days[day]} <span>${md(date)}</span></h3>${es.length?es.map(courseCard).join(''):`<p class="free">${esc(DATA.holidays[date]||'无已排定课程')}</p>`}</section>`}).join('');
$('week-summary').textContent=`本周 ${events.length} 次已排定课程${english.length?' · 另有 1 次英语课待补全时间':''}${events.some(e=>e[1]===7)?' · 思政上午课为 09:00–12:00':''}`;
}
function renderCourses(){$('course-grid').innerHTML=DATA.courses.map((c,i)=>{let es=DATA.events.filter(e=>e[1]===i);return `<details class="course" style="${style(i)}"><summary><span class="dot"></span><div><div class="course-name">${esc(c[1])}</div><div class="course-meta">${esc(c[2])} · ${c[3]} 学分 · ${c[4]}${i===7?' · 三班':''}</div><div class="course-meta">${es.length?`${es.length} 次 · ${[...new Set(es.map(e=>e[4]))].map(esc).join(' / ')}`:'<span class="pending-tag">时间地点待补充</span>'}</div></div><span class="chevron" aria-hidden="true">›</span></summary><div class="course-body"><p>课程号 ${c[0]} · 班号 ${c[5]}</p>${i===9?'<p>English Presentations and Public Speaking。以下日期来自课程大纲；时间、教室尚未提供，不计入已排定课程。</p><ul class="sessions">'+DATA.englishDates.map(d=>`<li>${md(d)} ${dayOf(d)} · 时间 / 教室待定</li>`).join('')+'</ul>':i===10?'<p>由各导师安排。所提供周课表中没有统一的时间与教室。</p>':'<ul class="sessions">'+es.map(e=>`<li>第 ${e[7]} 周 · ${md(e[0])} ${dayOf(e[0])}<br>${e[2]}–${e[3]} · ${esc(e[4])}${e[6]?' · '+esc(e[6]):''}</li>`).join('')+'</ul>'}</div></details>`}).join('')}
function choose(w){chosen=w;let url=new URL(location.href);url.searchParams.set('week',String(chosen));history.replaceState(null,'',url);renderWeek()}
$('prev').addEventListener('click',()=>choose(Math.max(1,chosen-1)));$('next-week').addEventListener('click',()=>choose(Math.min(18,chosen+1)));$('week').addEventListener('change',e=>choose(Number(e.target.value)));$('today').addEventListener('click',()=>{current=weekOf(shanghaiNow().date);if(current>=1&&current<=18)choose(current)});
nextClass();renderWeek();renderCourses();setInterval(()=>{current=weekOf(shanghaiNow().date);nextClass();renderWeek()},60000);
</script>
